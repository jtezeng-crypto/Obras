<body>
<div id="login" class="login"><h1>CONTROL DE OBRAS</h1><p class="muted">Acceso al sistema de seguimiento de proyectos</p><form id="loginForm"><div class="field"><label>Usuario</label><input id="loginUser" autocomplete="username" required></div><div class="field"><label>Contraseña</label><input id="loginPass" type="password" autocomplete="current-password" required></div><button style="width:100%">Ingresar</button></form><p id="loginError" style="color:#9a3232"></p><p class="muted" style="font-size:12px">Primera vez: usuario <b>admin</b> y contraseña <b>admin123</b>. Cambia la contraseña desde Usuarios. Demo local, no apta para producción.</p></div>
<div id="app" class="shell hidden"><aside class="side"><div class="brand">▦ CONTROL DE OBRAS</div><div class="muted" id="who"></div><button data-page="dashboard" class="active">▣ Panel general</button><button data-page="projects">▤ Proyectos</button><button data-page="advances">◷ Registro de avances</button><button data-page="extras">＋ Extras y modificaciones</button><button data-page="queries">☷ Consultas técnicas</button><button data-page="reports">▥ Vista gerencial</button><button data-page="users">♙ Usuarios</button><button id="logout">↪ Cerrar sesión</button></aside><main class="main"><div class="top"><div><h1 id="pageTitle">Panel general</h1><div class="muted">Gestión y seguimiento de obras</div></div><div class="pill" id="today"></div></div><div id="content"></div></main></div>
<script>
'use strict';
const KEY='control_obras_v1';
const fresh=()=>({users:[{id:'u1',name:'Administrador',username:'admin',password:'admin123',role:'admin'}],projects:[],advances:[],extras:[],queries:[]});
let db;try{db=JSON.parse(localStorage.getItem(KEY))||fresh()}catch{db=fresh()};
let current=null,page='dashboard';
const $=id=>document.getElementById(id),save=()=>localStorage.setItem(KEY,JSON.stringify(db));
const esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const num=v=>Number(v)||0,fmt=v=>num(v).toLocaleString('es-GT',{minimumFractionDigits:2,maximumFractionDigits:2}),pct=(a,b)=>b>0?Math.min(100,Math.max(0,a/b*100)):0;
const date=()=>new Date().toISOString().slice(0,10),uid=()=>crypto.randomUUID?crypto.randomUUID():String(Date.now()+Math.random());
const proj=id=>db.projects.find(p=>p.id===id),latest=id=>db.advances.filter(a=>a.projectId===id).sort((a,b)=>b.date.localeCompare(a.date)||b.created.localeCompare(a.created))[0];
const canEdit=()=>current.role!=='gerencia',isAdmin=()=>current.role==='admin';
const field=(label,name,type='text',value='',opts='')=>`<div class="field"><label>${label}</label><input name="${name}" type="${type}" value="${esc(value)}" ${opts}></div>`;
const selectProject=(name='projectId')=>`<div class="field"><label>Proyecto</label><select name="${name}" required>${db.projects.map(p=>`<option value="${esc(p.id)}">${esc(p.name)}</option>`).join('')}</select></div>`;
const bar=(value,max)=>`<div class="bar"><span style="width:${pct(value,max)}%"></span></div>`;
function login(){const u=db.users.find(x=>x.username===$('loginUser').value.trim()&&x.password===$('loginPass').value);if(!u){$('loginError').textContent='Usuario o contraseña incorrectos';return}current=u;$('login').classList.add('hidden');$('app').classList.remove('hidden');$('who').textContent=`${u.name} · ${u.role}`;render()}
$('loginForm').onsubmit=e=>{e.preventDefault();login()};$('logout').onclick=()=>{current=null;$('app').classList.add('hidden');$('login').classList.remove('hidden');$('loginPass').value=''};
document.querySelectorAll('[data-page]').forEach(b=>b.onclick=()=>{page=b.dataset.page;render()});
function render(){if(!current)return;document.querySelectorAll('[data-page]').forEach(b=>b.classList.toggle('active',b.dataset.page===page));$('today').textContent=new Date().toLocaleDateString('es-GT',{day:'2-digit',month:'long',year:'numeric'});const titles={dashboard:'Panel general',projects:'Administración de proyectos',advances:'Registro de avances',extras:'Extras y modificaciones',queries:'Consultas técnicas',reports:'Reporte ejecutivo para gerencia',users:'Administración de usuarios'};$('pageTitle').textContent=titles[page];$('content').innerHTML=({dashboard,projects,advances,extras,queries,reports,users})[page]();bind()}
function dashboard(){
 const active=db.projects.filter(p=>p.status!=='Finalizado'&&p.status!=='Suspendido').length;
 const weights=db.projects.reduce((s,p)=>s+num(p.weight),0);
 const avg=db.projects.length?db.projects.reduce((s,p)=>s+num(latest(p.id)?.progress),0)/db.projects.length:0;
 const pending=db.queries.filter(q=>q.status!=='Respondida').length;
 const counts={ok:0,warn:0,risk:0};
 db.projects.forEach(p=>{const a=latest(p.id),end=p.end?new Date(p.end+'T23:59:59'):null;if(p.status==='Finalizado')counts.ok++;else if(end&&end<new Date())counts.risk++;else if(!a||num(a.progress)<50)counts.warn++;else counts.ok++});
 const primary=db.projects[0],history=primary?db.advances.filter(a=>a.projectId===primary.id).sort((a,b)=>a.date.localeCompare(b.date)).slice(-7):[];
 const dists=[['Estructura principal',52.3,'#2f3a44'],['Secundaria',22.7,'#4e868f'],['Placas y anclajes',12.4,'#7da7a9'],['Escaleras y pasarelas',7.6,'#b4c9cd'],['Otros',5,'#e1e7e9']];
 return `<div class="cards">${[['▤','Proyectos activos',active],['◉','Avance promedio',avg.toFixed(0)+'%'],['▱','Peso del proyecto',fmt(weights)+' kg'],['⚠','Consultas pendientes',pending]].map(([ic,l,v])=>`<div class="card dash-card"><div class="dash-icon">${ic}</div><div class="muted">${l}</div><div class="number">${v}</div></div>`).join('')}</div>
 <div class="dash-grid"><section class="panel"><div class="dash-panel-title">Avance general del proyecto ${primary?'· '+esc(primary.name):''}</div>${history.length?`<div class="dash-chart">${history.map(h=>`<div style="height:${Math.max(2,num(h.progress))}%" title="${esc(h.date)} · ${num(h.progress)}%"><small>${esc(h.date.slice(5))}</small></div>`).join('')}</div>`:'<div class="empty">Registra avances para visualizar el progreso por fecha.</div>'}</section><section class="panel"><div class="dash-panel-title">Distribución referencial del peso por área</div><div style="display:flex;align-items:center;gap:17px;flex-wrap:wrap"><div class="dash-donut"><div>${fmt(weights)}<small>kg totales</small></div></div><div class="dash-legend">${dists.map(([name,val,color])=>`<div><i style="background:${color}"></i>${name}<b>${val}%</b></div>`).join('')}</div></div><p class="mini-help">Distribución ilustrativa; los porcentajes reales se registran por disciplina en cada avance.</p></section></div>
 <section class="panel"><div class="dash-heading"><h2>Proyectos en seguimiento</h2>${canEdit()?'<button id="dashNewProject">＋ Nuevo proyecto</button>':''}</div><div style="margin-top:14px">${projectTable()}</div></section>
 <div class="dash-bottom"><section class="panel"><h2>Semáforo de proyectos</h2>${[['Al día',counts.ok,'#4e9b80'],['Requieren seguimiento',counts.warn,'#d7a44b'],['Con fecha vencida',counts.risk,'#b76c68']].map(([name,value,color])=>`<div class="traffic-row"><i class="traffic-dot" style="background:${color}"></i><b>${name}</b><span>${value}</span></div>`).join('')}<p class="mini-help">Clasificación orientativa basada en estado, fecha de entrega y último avance.</p></section><section class="panel"><h2>Herramientas de seguimiento</h2><div class="traffic-row"><span>▤ &nbsp; Reportes automáticos en PDF</span><span>✓</span></div><div class="traffic-row"><span>▥ &nbsp; Avance por disciplina</span><span>✓</span></div><div class="traffic-row"><span>▧ &nbsp; Imagen del modelo estructural</span><span>✓</span></div><div class="traffic-row"><span>◷ &nbsp; Consultas y alertas</span><span>✓</span></div></section></div>`;
}
function projectTable(){return db.projects.length?`<div class="tablewrap"><table><thead><tr><th>Proyecto</th><th>Cliente</th><th>Estado</th><th>Avance</th><th>Peso (kg)</th><th>Acción</th></tr></thead><tbody>${db.projects.map(p=>{let a=latest(p.id);return `<tr><td><b>${esc(p.name)}</b><br><span class="muted">${esc(p.code)}</span></td><td>${esc(p.client)}</td><td><span class="status-chip ${p.status==='Finalizado'?'ok':p.status==='Suspendido'?'risk':p.status==='Planificación'?'warn':''}">${esc(p.status)}</span></td><td>${a?fmt(a.progress)+'%':'Sin datos'}${bar(a?.progress||0,100)}</td><td>${fmt(p.weight)}</td><td><button class="secondary" data-report="${esc(p.id)}">Ver reporte</button></td></tr>`}).join('')}</tbody></table></div>`:'<div class="empty">Aún no hay proyectos registrados.</div>'}
function projects(){return `${canEdit()?`<section class="panel"><h2>Nuevo proyecto</h2><form id="projectForm"><div class="fields">${field('Código','code','text','','required')}${field('Nombre del proyecto','name','text','','required')}${field('Cliente','client')}${field('Ubicación','location')}${field('Responsable','manager')}${field('Peso total (kg)','weight','number','0','min="0" step="0.01" required')}${field('Fecha de inicio','start','date',date())}${field('Fecha estimada de entrega','end','date') }<div class="field"><label>Estado</label><select name="status"><option>Planificación</option><option>En ejecución</option><option>Finalizado</option><option>Suspendido</option></select></div></div><div class="actions"><button>Guardar proyecto</button></div></form></section>`:''}<section class="panel"><h2>Proyectos registrados</h2>${projectTable()}</section>`}
function advances(){return `${canEdit()&&db.projects.length?`<section class="panel"><h2>Registrar avance de obra</h2><form id="advanceForm"><div class="fields">${selectProject()}${field('Fecha','date','date',date(),'required')}${field('Avance general (%)','progress','number','0','min="0" max="100" step="0.01" required')}${field('Peso modelado (kg)','modeled','number','0','min="0" step="0.01"')}${field('Peso enviado a fábrica (kg)','sent','number','0','min="0" step="0.01"')}${field('Peso en fabricación (kg)','inFactory','number','0','min="0" step="0.01"')}${field('Peso fabricado (kg)','fabricated','number','0','min="0" step="0.01"')}${field('Peso instalado (kg)','installed','number','0','min="0" step="0.01"')}${['Estructura principal','Estructura secundaria','Placas y anclajes','Escaleras y pasarelas','Detalles y conexiones'].map((l,i)=>field('Avance: '+l+' (%)','discipline'+i,'number','0','min="0" max="100" step="0.01"')).join('')}<div class="field wide"><label>Observaciones</label><textarea name="notes" rows="3"></textarea></div><div class="field wide"><label>Próximos pasos</label><textarea name="next" rows="3"></textarea></div></div><div class="actions"><button>Guardar avance</button></div></form></section>`:''}<section class="panel"><h2>Historial de avances</h2>${db.advances.length?`<div class="tablewrap"><table><tr><th>Fecha</th><th>Proyecto</th><th>Avance</th><th>Modelado (kg)</th><th>Fabricado (kg)</th></tr>${[...db.advances].sort((a,b)=>b.date.localeCompare(a.date)).map(a=>`<tr><td>${esc(a.date)}</td><td>${esc(proj(a.projectId)?.name||'—')}</td><td>${fmt(a.progress)}%</td><td>${fmt(a.modeled)}</td><td>${fmt(a.fabricated)}</td></tr>`).join('')}</table></div>`:'<div class="empty">Sin avances registrados.</div>'}</section>`}
function extras(){return `${canEdit()&&db.projects.length?`<section class="panel"><h2>Nueva modificación</h2><form id="extraForm"><div class="fields">${selectProject()}${field('Fecha','date','date',date(),'required')}${field('Descripción','description','text','','required')}${field('Peso adicional (kg)','weight','number','0','min="0" step="0.01"')}<div class="field"><label>Estado</label><select name="status"><option>Pendiente</option><option>En revisión</option><option>Aprobada</option><option>Rechazada</option></select></div></div><div class="actions"><button>Guardar modificación</button></div></form></section>`:''}<section class="panel"><h2>Modificaciones registradas</h2>${simpleTable(db.extras,['Fecha','Proyecto','Descripción','Peso (kg)','Estado'],x=>[x.date,proj(x.projectId)?.name,x.description,fmt(x.weight),x.status])}</section>`}
function queries(){return `${canEdit()&&db.projects.length?`<section class="panel"><h2>Nueva consulta técnica</h2><form id="queryForm"><div class="fields">${selectProject()}${field('Fecha','date','date',date(),'required')}${field('Asunto','subject','text','','required')}<div class="field"><label>Estado</label><select name="status"><option>Pendiente</option><option>En revisión</option><option>Respondida</option></select></div><div class="field wide"><label>Descripción</label><textarea name="description" rows="3"></textarea></div></div><div class="actions"><button>Guardar consulta</button></div></form></section>`:''}<section class="panel"><h2>Consultas registradas</h2>${simpleTable(db.queries,['Fecha','Proyecto','Asunto','Estado'],x=>[x.date,proj(x.projectId)?.name,x.subject,x.status])}</section>`}
function simpleTable(rows,heads,get){return rows.length?`<div class="tablewrap"><table><tr>${heads.map(h=>`<th>${h}</th>`).join('')}</tr>${rows.map(x=>`<tr>${get(x).map(v=>`<td>${esc(v)}</td>`).join('')}</tr>`).join('')}</table></div>`:'<div class="empty">No hay registros.</div>'}
function reports(){if(!db.projects.length)return '<section class="panel empty">Primero crea un proyecto.</section>';const id=window.selectedReport&&proj(window.selectedReport)?window.selectedReport:db.projects[0].id;window.selectedReport=id;const p=proj(id),a=latest(id),ex=db.extras.filter(x=>x.projectId===id),qs=db.queries.filter(x=>x.projectId===id),approved=ex.filter(x=>x.status==='Aprobada').reduce((s,x)=>s+num(x.weight),0),pending=qs.filter(x=>x.status!=='Respondida').length;const metrics=[['Peso modelado',a?.modeled],['Enviado a fábrica',a?.sent],['En fabricación',a?.inFactory],['Peso fabricado',a?.fabricated],['Peso instalado',a?.installed]];return `<div class="report-select no-print"><label style="margin:0">Proyecto</label><select id="reportChoice">${db.projects.map(x=>`<option value="${esc(x.id)}" ${x.id===id?'selected':''}>${esc(x.name)}</option>`).join('')}</select><button id="printReport">Imprimir / Guardar PDF</button></div><div class="report" style="margin-top:18px"><div class="reporthead"><div><h2>REPORTE DE CONTROL DE OBRA</h2><div>${esc(p.name)} · ${esc(p.code)}</div></div><div style="text-align:right">${esc(a?.date||date())}<br>INFORME EJECUTIVO</div></div><div class="grid2"><div class="panel"><h3>01 · RESUMEN GENERAL</h3><div class="metric">${fmt(a?.progress||0)}%</div><div class="muted">Avance general registrado</div>${bar(a?.progress||0,100)}<p>Cliente: <b>${esc(p.client||'—')}</b></p><p>Responsable: <b>${esc(p.manager||'—')}</b></p><p>Estado: <b>${esc(p.status)}</b></p></div><div class="panel"><h3>02 · INFORMACIÓN DEL PROYECTO</h3><p>Ubicación: ${esc(p.location||'—')}</p><p>Inicio: ${esc(p.start||'—')}</p><p>Entrega prevista: ${esc(p.end||'—')}</p><p>Peso total: <b>${fmt(p.weight)} kg</b></p><p>Última actualización: ${esc(a?.date||'Sin avances')}</p></div><div class="panel"><h3>03 · CONTROL DE PESOS</h3>${metrics.map(([l,v])=>`<div class="line"><span>${l}</span><b>${fmt(v)} kg · ${fmt(pct(num(v),num(p.weight)))}%</b></div>${bar(num(v),num(p.weight))}`).join('')}</div><div class="panel"><h3>04 · EXTRAS Y MODIFICACIONES</h3><div class="metric">${fmt(approved)} kg</div><div class="muted">Extras aprobadas</div><p>Registros totales: <b>${ex.length}</b></p><p>Pendientes: <b>${ex.filter(x=>x.status==='Pendiente').length}</b></p><p>En revisión: <b>${ex.filter(x=>x.status==='En revisión').length}</b></p></div><div class="panel"><h3>05 · COMUNICACIÓN Y CONSULTAS</h3><div class="metric">${qs.length}</div><div class="muted">Consultas técnicas</div><p>Respondidas: <b>${qs.filter(x=>x.status==='Respondida').length}</b></p><p>Pendientes / revisión: <b>${pending}</b></p></div><div class="panel"><h3>06 · EVOLUCIÓN DE AVANCES</h3>${db.advances.filter(x=>x.projectId===id).sort((x,y)=>x.date.localeCompare(y.date)).slice(-6).map(x=>`<div class="line"><span>${esc(x.date)}</span><b>${fmt(x.progress)}%</b></div>${bar(x.progress,100)}`).join('')||'<p class="muted">Sin historial.</p>'}</div><div class="panel"><h3>07 · OBSERVACIONES</h3><div class="note">${esc(a?.notes||'Sin observaciones registradas.')}</div></div><div class="panel"><h3>08 · PRÓXIMOS PASOS</h3><div class="note">${esc(a?.next||'Sin próximos pasos registrados.')}</div></div></div><p class="muted" style="font-size:11px;margin-top:18px">Reporte generado desde CONTROL DE OBRAS · Datos almacenados localmente en este navegador.</p></div>`}
function users(){if(!isAdmin())return '<section class="panel">Solo el administrador puede gestionar usuarios.</section>';return `<section class="panel"><h2>Crear usuario</h2><form id="userForm"><div class="fields">${field('Nombre','name','text','','required')}${field('Usuario','username','text','','required')}${field('Contraseña','password','password','','required minlength="8"')}<div class="field"><label>Rol</label><select name="role"><option value="editor">Editor</option><option value="gerencia">Gerencia</option><option value="admin">Administrador</option></select></div></div><div class="actions"><button>Crear usuario</button></div></form></section><section class="panel"><h2>Usuarios</h2>${simpleTable(db.users,['Nombre','Usuario','Rol'],u=>[u.name,u.username,u.role])}<h3 style="margin-top:20px">Cambiar mi contraseña</h3><form id="passwordForm"><div class="fields">${field('Nueva contraseña','password','password','','required minlength="8"')}</div><div class="actions"><button>Actualizar contraseña</button></div></form></section>`}
function bind(){document.querySelectorAll('[data-report]').forEach(b=>b.onclick=()=>{window.selectedReport=b.dataset.report;page='reports';render()});if($('reportChoice'))$('reportChoice').onchange=e=>{window.selectedReport=e.target.value;render()};if($('printReport'))$('printReport').onclick=()=>window.print();const forms=[['projectForm','projects',v=>({...v,weight:num(v.weight)})],['advanceForm','advances',v=>({...v,...Object.fromEntries(['progress','modeled','sent','inFactory','fabricated','installed','discipline0','discipline1','discipline2','discipline3','discipline4'].map(k=>[k,num(v[k])])),created:new Date().toISOString()})],['extraForm','extras',v=>({...v,weight:num(v.weight)})],['queryForm','queries',v=>v],['userForm','users',v=>v]];for(const [id,table,convert] of forms){const f=$(id);if(f)f.onsubmit=e=>{e.preventDefault();const v=Object.fromEntries(new FormData(f));if(table==='users'&&db.users.some(u=>u.username===v.username)){alert('El nombre de usuario ya existe');return}if(table==='projects'&&db.projects.some(p=>p.code===v.code)){alert('El código de proyecto ya existe');return}if(table==='advances'&&num(v.progress)>100){alert('El avance no puede superar 100%');return}db[table].push({id:uid(),...convert(v)});save();render()}}const pf=$('passwordForm');if(pf)pf.onsubmit=e=>{e.preventDefault();current.password=new FormData(pf).get('password');save();alert('Contraseña actualizada');render()}}
render();
</script>

<script id="executive-report-script">
const erDate=d=>d?new Date(d+'T12:00:00').toLocaleDateString('es-GT',{day:'2-digit',month:'short',year:'numeric'}).toUpperCase():'—';
const erNum=v=>fmt(v);
const erPercent=v=>Math.max(0,Math.min(100,Number(v)||0));
const erBar=(v,max)=>`<div class="er-bar"><span style="width:${pct(num(v),num(max))}%"></span></div>`;
const erRow=(name,value,total)=>`<tr><td>${esc(name)}</td><td>${erNum(value)} kg</td><td>${pct(num(value),num(total)).toFixed(1)}%</td></tr><tr><td colspan="3">${erBar(value,total)}</td></tr>`;
const erStoredImage=id=>{try{return localStorage.getItem('control_obras_model_'+id)||''}catch{return ''}};
reports=function(){
 if(!db.projects.length)return '<section class="panel empty">Primero crea un proyecto.</section>';
 const id=window.selectedReport&&proj(window.selectedReport)?window.selectedReport:db.projects[0].id;window.selectedReport=id;
 const p=proj(id),a=latest(id),ex=db.extras.filter(x=>x.projectId===id),qs=db.queries.filter(x=>x.projectId===id);
 const hist=db.advances.filter(x=>x.projectId===id).sort((x,y)=>x.date.localeCompare(y.date)).slice(-6);
 const total=num(p.weight),modeled=num(a?.modeled),sent=num(a?.sent),factory=num(a?.inFactory),fabricated=num(a?.fabricated),installed=num(a?.installed),progress=erPercent(a?.progress);
 const approved=ex.filter(x=>x.status==='Aprobada').reduce((s,x)=>s+num(x.weight),0),extraPending=ex.filter(x=>x.status==='Pendiente'||x.status==='En revisión').reduce((s,x)=>s+num(x.weight),0),extraTotal=ex.reduce((s,x)=>s+num(x.weight),0);
 const queryCount=status=>qs.filter(x=>x.status===status).length;
 const start=p.start?new Date(p.start+'T12:00:00'):null,end=p.end?new Date(p.end+'T12:00:00'):null,now=new Date();
 const elapsed=start?Math.max(0,Math.floor((now-start)/86400000)):null,remaining=end?Math.ceil((end-now)/86400000):null;
 const img=erStoredImage(id);
 const reportDate=a?.date||date();
 return `<div class="er-actions no-print"><label>Proyecto</label><select id="reportChoice" style="width:auto;min-width:210px">${db.projects.map(x=>`<option value="${esc(x.id)}" ${x.id===id?'selected':''}>${esc(x.name)}</option>`).join('')}</select><button id="printReport">Exportar / Guardar PDF</button><label class="er-label" for="erImageInput">Imagen del modelo (JPG/PNG)</label><input id="erImageInput" type="file" accept="image/png,image/jpeg,image/webp"><button id="erClearImage" class="secondary">Quitar imagen</button></div>
 <article class="executive-report">
 <header class="er-head"><div><h2>REPORTE DE CONTROL DE OBRA</h2><div class="er-sub">ESTRUCTURAS DE ACERO</div></div><div class="er-meta">▣ &nbsp; FECHA DEL REPORTE: <b>${erDate(reportDate)}</b><br>▣ &nbsp; PERÍODO DEL REPORTE: <b>${erDate(p.start)} – ${erDate(reportDate)}</b><br>◷ &nbsp; REPORTE No.: <b>${esc(p.code||'SIN CÓDIGO')}-${esc(reportDate)}</b></div></header>
 <div class="er-info"><div><b>▥ &nbsp; PROYECTO:</b><span>${esc(p.name)}</span></div><div><b>♧ &nbsp; UBICACIÓN:</b><span>${esc(p.location||'No registrada')}</span></div><div><b>♙ &nbsp; CLIENTE:</b><span>${esc(p.client||'No registrado')}</span></div><div><b>♙ &nbsp; RESPONSABLE:</b><span>${esc(p.manager||'No registrado')}</span></div></div>
 <div class="er-grid">
 <section class="er-box"><h3>1. &nbsp; RESUMEN GENERAL DEL PROYECTO</h3><div class="er-titleline">AVANCE GENERAL</div><div class="er-split"><div class="er-ring" style="--progress:${progress}%"><div class="er-ring-inner"><div class="er-big">${progress.toFixed(0)}%</div><small>Avance del proyecto</small></div></div><div><div class="er-row"><b>ESTADO GENERAL:</b><span>${esc(p.status)}</span></div><div class="er-row"><b>INICIO:</b><span>${erDate(p.start)}</span></div><div class="er-row"><b>ENTREGA ESTIMADA:</b><span>${erDate(p.end)}</span></div><div class="er-row"><b>DÍAS TRANSCURRIDOS:</b><span>${elapsed??'—'}</span></div><div class="er-row"><b>DÍAS RESTANTES:</b><span>${remaining??'—'}</span></div></div></div></section>
 <section class="er-box"><h3>2. &nbsp; VISTA GENERAL DEL MODELO</h3><div class="er-image">${img?`<img src="${img}" alt="Modelo estructural del proyecto">`:'<div style="text-align:center;color:#888"><div style="font-size:45px">▥</div>Sin imagen del modelo<br><small>Cárgala con el botón superior</small></div>'}</div><p class="er-small">Modelo estructural de referencia del proyecto</p></section>
 <section class="er-box"><h3>3. &nbsp; CONTROL DE PESO (KG)</h3><table class="er-table"><tr><td><b>PESO TOTAL DEL PROYECTO</b></td><td><b>${erNum(total)} kg</b></td><td>100%</td></tr>${erRow('PESO MODELADO',modeled,total)}${erRow('PESO ENVIADO A FÁBRICA',sent,total)}${erRow('PESO EN PROCESO DE FABRICACIÓN',factory,total)}${erRow('PESO FABRICADO',fabricated,total)}${erRow('PESO INSTALADO',installed,total)}${erRow('PESO PENDIENTE POR ENVIAR',Math.max(0,total-sent),total)}${erRow('PESO DE EXTRAS / MODIFICACIONES',extraTotal,total)}</table></section>
 <section class="er-box"><h3>4. &nbsp; CONTROL DE EXTRAS / MODIFICACIONES</h3><div class="er-split"><div class="er-ring" style="--progress:${pct(approved,extraTotal)}%"><div class="er-ring-inner"><b style="font-size:22px">${erNum(extraTotal)}</b><small>KG · Extras del proyecto</small></div></div><div><div class="er-row"><span>● APROBADAS</span><b>${erNum(approved)} kg</b></div><div class="er-row"><span>● PENDIENTES / REVISIÓN</span><b>${erNum(extraPending)} kg</b></div><div class="er-row"><span>% DEL PESO TOTAL</span><b>${pct(extraTotal,total).toFixed(1)}%</b></div></div></div><h3 style="margin-top:22px">DISTRIBUCIÓN DE EXTRAS REGISTRADAS</h3>${ex.length?ex.slice(-6).map(x=>`<div class="er-row"><span class="er-break">${esc(x.description)}</span><b>${erNum(x.weight)} kg</b></div>${erBar(x.weight,extraTotal)}`).join(''):'<p class="er-small">Sin modificaciones registradas.</p>'}</section>
 <section class="er-box"><h3>5. &nbsp; COMUNICACIÓN Y PROPUESTAS</h3><div class="er-split"><div style="text-align:center"><div class="er-small">CONSULTAS TÉCNICAS</div><div class="er-big">${qs.length}</div><small>ENVIADAS</small></div><div><div class="er-row"><span>Respondidas</span><b>${queryCount('Respondida')}</b></div><div class="er-row"><span>Pendientes</span><b>${queryCount('Pendiente')}</b></div><div class="er-row"><span>En revisión</span><b>${queryCount('En revisión')}</b></div></div></div><p class="er-small">Las propuestas se pueden registrar en el apartado de extras y modificaciones.</p></section>
 <section class="er-box"><h3>6. &nbsp; AVANCE POR DISCIPLINA / ÁREA</h3>${[['ESTRUCTURA PRINCIPAL',0],['ESTRUCTURA SECUNDARIA',1],['PLACAS Y ANCLAJES',2],['ESCALERAS Y PASARELAS',3],['DETALLES Y CONEXIONES',4]].map(([name,i])=>`<div class="er-row"><span>${name}</span><b>${a?.['discipline'+i]!==undefined?num(a['discipline'+i]).toFixed(0)+'%':'Sin datos'}</b></div>${a?.['discipline'+i]!==undefined?erBar(a['discipline'+i],100):''}`).join('')}</section>
 <section class="er-box er-wide"><h3>7. &nbsp; GRÁFICOS DE PROGRESO</h3><div class="er-three"><div><b class="er-small">PROGRESO REGISTRADO POR FECHA</b><div class="er-chart">${hist.map(x=>`<div style="height:${erPercent(x.progress)}%"><small>${esc(x.date.slice(5))}</small></div>`).join('')}</div><div class="er-small" style="margin-top:22px">${hist.length?'Evolución del avance general':'Sin historial de avances'}</div></div><div><b class="er-small">COMPARATIVO DE PESOS</b>${[['MODELADO',modeled],['FABRICADO',fabricated],['EN FABRICACIÓN',factory],['INSTALADO',installed]].map(([label,value])=>`<div class="er-small" style="margin-top:10px">${label}: ${erNum(value)} kg</div>${erBar(value,total)}`).join('')}</div><div><b class="er-small">DISTRIBUCIÓN DE PESO</b><div class="er-ring" style="width:115px;height:115px;margin-top:8px;--progress:${pct(installed,total)}%"><div class="er-ring-inner" style="width:77px;height:77px"><b>${pct(installed,total).toFixed(1)}%</b><small>Instalado</small></div></div><p class="er-small" style="text-align:center">Con relación al peso total</p></div></div></section>
 </div><div class="er-foot"><section class="er-box"><h3>8. &nbsp; OBSERVACIONES / COMENTARIOS</h3><div class="er-notes">${esc(a?.notes||'Sin observaciones registradas.')}</div></section><section class="er-box"><h3>9. &nbsp; PRÓXIMOS PASOS</h3><div class="er-notes">${esc(a?.next||'Sin próximos pasos registrados.')}</div></section></div>
 </article>`;
};
const previousBind=bind;
bind=function(){previousBind();const np=$('dashNewProject');if(np)np.onclick=()=>{page='projects';render()};const input=$('erImageInput');if(input)input.onchange=e=>{const f=e.target.files?.[0];if(!f)return;if(f.size>3*1024*1024){alert('Utiliza una imagen menor de 3 MB.');return}const reader=new FileReader();reader.onload=()=>{try{localStorage.setItem('control_obras_model_'+window.selectedReport,reader.result);render()}catch{alert('No hay espacio de almacenamiento disponible. Usa una imagen más pequeña.')}};reader.readAsDataURL(f)};const clear=$('erClearImage');if(clear)clear.onclick=()=>{localStorage.removeItem('control_obras_model_'+window.selectedReport);render()}};
</script>
</body></html>
