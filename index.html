<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>CONTROL DE OBRAS | Gestión de proyectos</title>
<style>
:root{font-family:Inter,system-ui,Arial,sans-serif;color:#20242a;background:#f1f2f4}*{box-sizing:border-box}body{margin:0}button,input,select,textarea{font:inherit}button{cursor:pointer;border:0;border-radius:7px;padding:10px 14px;background:#252a31;color:white}button:hover{background:#444b54}button.secondary{background:#e4e6e9;color:#252a31}button.danger{background:#8d3434}input,select,textarea{border:1px solid #cbd0d6;border-radius:7px;padding:10px;background:white;width:100%;min-width:0}label{display:block;font-size:12px;font-weight:700;color:#505761;margin-bottom:5px}.shell{display:grid;grid-template-columns:240px 1fr;min-height:100vh}.side{background:#242930;color:white;padding:24px 15px}.brand{font-size:19px;font-weight:800;letter-spacing:.5px;padding:6px 10px 25px;border-bottom:1px solid #555}.side button{width:100%;text-align:left;background:transparent;margin-top:9px}.side button.active,.side button:hover{background:#454c56}.side .muted{color:#c3c7cc;font-size:12px;padding:15px 10px}.main{padding:28px;max-width:1500px;width:100%;margin:auto}.top{display:flex;justify-content:space-between;align-items:center;gap:15px;margin-bottom:23px;flex-wrap:wrap}h1{font-size:27px;margin:0}h2{font-size:19px;margin:0 0 17px}h3{font-size:15px;margin:0 0 10px}.muted{color:#727983}.cards{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:14px}.card,.panel{background:white;border:1px solid #dce0e4;border-radius:12px;padding:20px}.card .number{font-size:30px;font-weight:800;margin-top:9px}.panel{margin-top:18px}.grid2{display:grid;grid-template-columns:1fr 1fr;gap:18px}.fields{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:15px}.field.wide{grid-column:1/-1}.actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:16px}.tablewrap{overflow-x:auto}table{border-collapse:collapse;width:100%;font-size:13px}th,td{text-align:left;padding:12px;border-bottom:1px solid #e4e7eb}th{background:#f5f6f7;color:#515860}.bar{height:11px;background:#e4e6e8;border-radius:12px;overflow:hidden}.bar span{display:block;height:100%;background:#5c6570}.line{display:flex;justify-content:space-between;gap:10px;margin:12px 0 6px}.login{max-width:420px;margin:9vh auto;padding:30px;background:white;border-radius:14px;border:1px solid #ddd}.login h1{margin-bottom:10px}.login .field{margin:18px 0}.hidden{display:none!important}.report{background:white;border:1px solid #cdd1d6;padding:24px;color:#222}.reporthead{background:#2a2e34;color:white;padding:20px;display:flex;justify-content:space-between;gap:15px;align-items:center}.reporthead h2{margin:0;font-size:23px}.metric{font-size:32px;font-weight:800}.report .panel{margin-top:0;border-radius:0}.report .grid2{margin-top:13px}.pill{display:inline-block;background:#e7e9ec;padding:4px 8px;border-radius:20px;font-size:12px}.empty{padding:30px;text-align:center;color:#6b737c}.note{background:#f1f2f4;padding:13px;border-left:4px solid #555e69;margin:12px 0;white-space:pre-wrap}.report-select{display:flex;gap:10px;align-items:center;flex-wrap:wrap}.report-select select{width:auto;min-width:220px}@media(max-width:900px){.shell{grid-template-columns:1fr}.side{padding:12px}.side button{width:auto}.cards{grid-template-columns:repeat(2,1fr)}.grid2{grid-template-columns:1fr}.main{padding:15px}}@media(max-width:520px){.cards,.fields{grid-template-columns:1fr}.report{padding:10px}}@media print{body{background:white}.side,.top,.no-print,.actions{display:none!important}.shell{display:block}.main{padding:0;max-width:none}.report{border:0;padding:0}.report .grid2{grid-template-columns:1fr 1fr;gap:9px}.report .panel{break-inside:avoid;padding:12px} @page{size:A3 portrait;margin:12mm}}
</style>
</head>
<body>
<div id="login" class="login"><h1>CONTROL DE OBRAS</h1><p class="muted">Acceso al sistema de seguimiento de proyectos</p><form id="loginForm"><div class="field"><label>Usuario</label><input id="loginUser" autocomplete="username" required></div><div class="field"><label>Contraseña</label><input id="loginPass" type="password" autocomplete="current-password" required></div><button style="width:100%">Ingresar</button></form><p id="loginError" style="color:#9a3232"></p><p class="muted" style="font-size:12px">Primera vez: usuario <b>admin</b> y contraseña <b>admin123</b>. Cambia la contraseña desde Usuarios. Demo local, no apta para producción.</p></div>
<div id="app" class="shell hidden"><aside class="side"><div class="brand">▦ CONTROL DE OBRAS</div><div class="muted" id="who"></div><button data-page="dashboard" class="active">▣ Panel general</button><button data-page="projects">▤ Proyectos</button><button data-page="advances">◷ Registro de avances</button><button data-page="extras">＋ Extras y modificaciones</button><button data-page="queries">☷ Consultas técnicas</button><button data-page="reports">▥ Vista gerencial</button><button data-page="users">♙ Usuarios</button><button id="logout">↪ Cerrar sesión</button></aside><main class="main"><div class="top"><div><h1 id="pageTitle">Panel general</h1><div class="muted">Gestión y seguimiento de obras</div></div><div class="pill" id="today"></div></div><div id="content"></div></main></div>
<script>
'use strict';
const KEY='control_obras_v1';
const fresh=()=>({users:[{id:'u1',name:'Administrador',username:'admin',password:'admin123',role:'admin'}],projects:[],advances:[],extras:[],queries:[]});
let db;try{db=JSON.parse(localStorage.getItem(KEY))||fresh()}catch{db=fresh()};
let current=null,page='dashboard';
const $=id=>document.getElementById(id),save=()=>localStorage.setItem(KEY,JSON.stringify(db));
const esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const num=v=>Number(v)||0,fmt=v=>num(v).toLocaleString('es-GT',{minimumFractionDigits:2,maximumFractionDigits:2}),pct=(a,b)=>b>0?Math.min(100,Math.max(0,a/b*100)):0;
const date=()=>new Date().toISOString().slice(0,10),uid=()=>crypto.randomUUID?crypto.randomUUID():String(Date.now()+Math.random());
const proj=id=>db.projects.find(p=>p.id===id),latest=id=>db.advances.filter(a=>a.projectId===id).sort((a,b)=>b.date.localeCompare(a.date)||b.created.localeCompare(a.created))[0];
const canEdit=()=>current.role!=='gerencia',isAdmin=()=>current.role==='admin';
const field=(label,name,type='text',value='',opts='')=>`<div class="field"><label>${label}</label><input name="${name}" type="${type}" value="${esc(value)}" ${opts}></div>`;
const selectProject=(name='projectId')=>`<div class="field"><label>Proyecto</label><select name="${name}" required>${db.projects.map(p=>`<option value="${esc(p.id)}">${esc(p.name)}</option>`).join('')}</select></div>`;
const bar=(value,max)=>`<div class="bar"><span style="width:${pct(value,max)}%"></span></div>`;
function login(){const u=db.users.find(x=>x.username===$('loginUser').value.trim()&&x.password===$('loginPass').value);if(!u){$('loginError').textContent='Usuario o contraseña incorrectos';return}current=u;$('login').classList.add('hidden');$('app').classList.remove('hidden');$('who').textContent=`${u.name} · ${u.role}`;render()}
$('loginForm').onsubmit=e=>{e.preventDefault();login()};$('logout').onclick=()=>{current=null;$('app').classList.add('hidden');$('login').classList.remove('hidden');$('loginPass').value=''};
document.querySelectorAll('[data-page]').forEach(b=>b.onclick=()=>{page=b.dataset.page;render()});
function render(){if(!current)return;document.querySelectorAll('[data-page]').forEach(b=>b.classList.toggle('active',b.dataset.page===page));$('today').textContent=new Date().toLocaleDateString('es-GT',{day:'2-digit',month:'long',year:'numeric'});const titles={dashboard:'Panel general',projects:'Administración de proyectos',advances:'Registro de avances',extras:'Extras y modificaciones',queries:'Consultas técnicas',reports:'Reporte ejecutivo para gerencia',users:'Administración de usuarios'};$('pageTitle').textContent=titles[page];$('content').innerHTML=({dashboard,projects,advances,extras,queries,reports,users})[page]();bind()}
function dashboard(){const active=db.projects.filter(p=>p.status==='En ejecución').length,finished=db.projects.filter(p=>p.status==='Finalizado').length,weight=db.projects.reduce((s,p)=>s+num(p.weight),0);return `<div class="cards">${[['Proyectos',db.projects.length],['En ejecución',active],['Finalizados',finished],['Peso total (kg)',fmt(weight)]].map(([l,v])=>`<div class="card"><div class="muted">${l}</div><div class="number">${v}</div></div>`).join('')}</div><section class="panel"><h2>Resumen de proyectos</h2>${projectTable()}</section>`}
function projectTable(){return db.projects.length?`<div class="tablewrap"><table><thead><tr><th>Proyecto</th><th>Cliente</th><th>Estado</th><th>Avance</th><th>Peso (kg)</th><th>Acción</th></tr></thead><tbody>${db.projects.map(p=>{let a=latest(p.id);return `<tr><td><b>${esc(p.name)}</b><br><span class="muted">${esc(p.code)}</span></td><td>${esc(p.client)}</td><td>${esc(p.status)}</td><td>${a?fmt(a.progress)+'%':'Sin datos'}${bar(a?.progress||0,100)}</td><td>${fmt(p.weight)}</td><td><button class="secondary" data-report="${esc(p.id)}">Ver reporte</button></td></tr>`}).join('')}</tbody></table></div>`:'<div class="empty">Aún no hay proyectos registrados.</div>'}
function projects(){return `${canEdit()?`<section class="panel"><h2>Nuevo proyecto</h2><form id="projectForm"><div class="fields">${field('Código','code','text','','required')}${field('Nombre del proyecto','name','text','','required')}${field('Cliente','client')}${field('Ubicación','location')}${field('Responsable','manager')}${field('Peso total (kg)','weight','number','0','min="0" step="0.01" required')}${field('Fecha de inicio','start','date',date())}${field('Fecha estimada de entrega','end','date') }<div class="field"><label>Estado</label><select name="status"><option>Planificación</option><option>En ejecución</option><option>Finalizado</option><option>Suspendido</option></select></div></div><div class="actions"><button>Guardar proyecto</button></div></form></section>`:''}<section class="panel"><h2>Proyectos registrados</h2>${projectTable()}</section>`}
function advances(){return `${canEdit()&&db.projects.length?`<section class="panel"><h2>Registrar avance de obra</h2><form id="advanceForm"><div class="fields">${selectProject()}${field('Fecha','date','date',date(),'required')}${field('Avance general (%)','progress','number','0','min="0" max="100" step="0.01" required')}${field('Peso modelado (kg)','modeled','number','0','min="0" step="0.01"')}${field('Peso enviado a fábrica (kg)','sent','number','0','min="0" step="0.01"')}${field('Peso en fabricación (kg)','inFactory','number','0','min="0" step="0.01"')}${field('Peso fabricado (kg)','fabricated','number','0','min="0" step="0.01"')}${field('Peso instalado (kg)','installed','number','0','min="0" step="0.01"')}<div class="field wide"><label>Observaciones</label><textarea name="notes" rows="3"></textarea></div><div class="field wide"><label>Próximos pasos</label><textarea name="next" rows="3"></textarea></div></div><div class="actions"><button>Guardar avance</button></div></form></section>`:''}<section class="panel"><h2>Historial de avances</h2>${db.advances.length?`<div class="tablewrap"><table><tr><th>Fecha</th><th>Proyecto</th><th>Avance</th><th>Modelado (kg)</th><th>Fabricado (kg)</th></tr>${[...db.advances].sort((a,b)=>b.date.localeCompare(a.date)).map(a=>`<tr><td>${esc(a.date)}</td><td>${esc(proj(a.projectId)?.name||'—')}</td><td>${fmt(a.progress)}%</td><td>${fmt(a.modeled)}</td><td>${fmt(a.fabricated)}</td></tr>`).join('')}</table></div>`:'<div class="empty">Sin avances registrados.</div>'}</section>`}
function extras(){return `${canEdit()&&db.projects.length?`<section class="panel"><h2>Nueva modificación</h2><form id="extraForm"><div class="fields">${selectProject()}${field('Fecha','date','date',date(),'required')}${field('Descripción','description','text','','required')}${field('Peso adicional (kg)','weight','number','0','min="0" step="0.01"')}<div class="field"><label>Estado</label><select name="status"><option>Pendiente</option><option>En revisión</option><option>Aprobada</option><option>Rechazada</option></select></div></div><div class="actions"><button>Guardar modificación</button></div></form></section>`:''}<section class="panel"><h2>Modificaciones registradas</h2>${simpleTable(db.extras,['Fecha','Proyecto','Descripción','Peso (kg)','Estado'],x=>[x.date,proj(x.projectId)?.name,x.description,fmt(x.weight),x.status])}</section>`}
function queries(){return `${canEdit()&&db.projects.length?`<section class="panel"><h2>Nueva consulta técnica</h2><form id="queryForm"><div class="fields">${selectProject()}${field('Fecha','date','date',date(),'required')}${field('Asunto','subject','text','','required')}<div class="field"><label>Estado</label><select name="status"><option>Pendiente</option><option>En revisión</option><option>Respondida</option></select></div><div class="field wide"><label>Descripción</label><textarea name="description" rows="3"></textarea></div></div><div class="actions"><button>Guardar consulta</button></div></form></section>`:''}<section class="panel"><h2>Consultas registradas</h2>${simpleTable(db.queries,['Fecha','Proyecto','Asunto','Estado'],x=>[x.date,proj(x.projectId)?.name,x.subject,x.status])}</section>`}
function simpleTable(rows,heads,get){return rows.length?`<div class="tablewrap"><table><tr>${heads.map(h=>`<th>${h}</th>`).join('')}</tr>${rows.map(x=>`<tr>${get(x).map(v=>`<td>${esc(v)}</td>`).join('')}</tr>`).join('')}</table></div>`:'<div class="empty">No hay registros.</div>'}
function reports(){if(!db.projects.length)return '<section class="panel empty">Primero crea un proyecto.</section>';const id=window.selectedReport&&proj(window.selectedReport)?window.selectedReport:db.projects[0].id;window.selectedReport=id;const p=proj(id),a=latest(id),ex=db.extras.filter(x=>x.projectId===id),qs=db.queries.filter(x=>x.projectId===id),approved=ex.filter(x=>x.status==='Aprobada').reduce((s,x)=>s+num(x.weight),0),pending=qs.filter(x=>x.status!=='Respondida').length;const metrics=[['Peso modelado',a?.modeled],['Enviado a fábrica',a?.sent],['En fabricación',a?.inFactory],['Peso fabricado',a?.fabricated],['Peso instalado',a?.installed]];return `<div class="report-select no-print"><label style="margin:0">Proyecto</label><select id="reportChoice">${db.projects.map(x=>`<option value="${esc(x.id)}" ${x.id===id?'selected':''}>${esc(x.name)}</option>`).join('')}</select><button id="printReport">Imprimir / Guardar PDF</button></div><div class="report" style="margin-top:18px"><div class="reporthead"><div><h2>REPORTE DE CONTROL DE OBRA</h2><div>${esc(p.name)} · ${esc(p.code)}</div></div><div style="text-align:right">${esc(a?.date||date())}<br>INFORME EJECUTIVO</div></div><div class="grid2"><div class="panel"><h3>01 · RESUMEN GENERAL</h3><div class="metric">${fmt(a?.progress||0)}%</div><div class="muted">Avance general registrado</div>${bar(a?.progress||0,100)}<p>Cliente: <b>${esc(p.client||'—')}</b></p><p>Responsable: <b>${esc(p.manager||'—')}</b></p><p>Estado: <b>${esc(p.status)}</b></p></div><div class="panel"><h3>02 · INFORMACIÓN DEL PROYECTO</h3><p>Ubicación: ${esc(p.location||'—')}</p><p>Inicio: ${esc(p.start||'—')}</p><p>Entrega prevista: ${esc(p.end||'—')}</p><p>Peso total: <b>${fmt(p.weight)} kg</b></p><p>Última actualización: ${esc(a?.date||'Sin avances')}</p></div><div class="panel"><h3>03 · CONTROL DE PESOS</h3>${metrics.map(([l,v])=>`<div class="line"><span>${l}</span><b>${fmt(v)} kg · ${fmt(pct(num(v),num(p.weight)))}%</b></div>${bar(num(v),num(p.weight))}`).join('')}</div><div class="panel"><h3>04 · EXTRAS Y MODIFICACIONES</h3><div class="metric">${fmt(approved)} kg</div><div class="muted">Extras aprobadas</div><p>Registros totales: <b>${ex.length}</b></p><p>Pendientes: <b>${ex.filter(x=>x.status==='Pendiente').length}</b></p><p>En revisión: <b>${ex.filter(x=>x.status==='En revisión').length}</b></p></div><div class="panel"><h3>05 · COMUNICACIÓN Y CONSULTAS</h3><div class="metric">${qs.length}</div><div class="muted">Consultas técnicas</div><p>Respondidas: <b>${qs.filter(x=>x.status==='Respondida').length}</b></p><p>Pendientes / revisión: <b>${pending}</b></p></div><div class="panel"><h3>06 · EVOLUCIÓN DE AVANCES</h3>${db.advances.filter(x=>x.projectId===id).sort((x,y)=>x.date.localeCompare(y.date)).slice(-6).map(x=>`<div class="line"><span>${esc(x.date)}</span><b>${fmt(x.progress)}%</b></div>${bar(x.progress,100)}`).join('')||'<p class="muted">Sin historial.</p>'}</div><div class="panel"><h3>07 · OBSERVACIONES</h3><div class="note">${esc(a?.notes||'Sin observaciones registradas.')}</div></div><div class="panel"><h3>08 · PRÓXIMOS PASOS</h3><div class="note">${esc(a?.next||'Sin próximos pasos registrados.')}</div></div></div><p class="muted" style="font-size:11px;margin-top:18px">Reporte generado desde CONTROL DE OBRAS · Datos almacenados localmente en este navegador.</p></div>`}
function users(){if(!isAdmin())return '<section class="panel">Solo el administrador puede gestionar usuarios.</section>';return `<section class="panel"><h2>Crear usuario</h2><form id="userForm"><div class="fields">${field('Nombre','name','text','','required')}${field('Usuario','username','text','','required')}${field('Contraseña','password','password','','required minlength="8"')}<div class="field"><label>Rol</label><select name="role"><option value="editor">Editor</option><option value="gerencia">Gerencia</option><option value="admin">Administrador</option></select></div></div><div class="actions"><button>Crear usuario</button></div></form></section><section class="panel"><h2>Usuarios</h2>${simpleTable(db.users,['Nombre','Usuario','Rol'],u=>[u.name,u.username,u.role])}<h3 style="margin-top:20px">Cambiar mi contraseña</h3><form id="passwordForm"><div class="fields">${field('Nueva contraseña','password','password','','required minlength="8"')}</div><div class="actions"><button>Actualizar contraseña</button></div></form></section>`}
function bind(){document.querySelectorAll('[data-report]').forEach(b=>b.onclick=()=>{window.selectedReport=b.dataset.report;page='reports';render()});if($('reportChoice'))$('reportChoice').onchange=e=>{window.selectedReport=e.target.value;render()};if($('printReport'))$('printReport').onclick=()=>window.print();const forms=[['projectForm','projects',v=>({...v,weight:num(v.weight)})],['advanceForm','advances',v=>({...v,...Object.fromEntries(['progress','modeled','sent','inFactory','fabricated','installed'].map(k=>[k,num(v[k])])),created:new Date().toISOString()})],['extraForm','extras',v=>({...v,weight:num(v.weight)})],['queryForm','queries',v=>v],['userForm','users',v=>v]];for(const [id,table,convert] of forms){const f=$(id);if(f)f.onsubmit=e=>{e.preventDefault();const v=Object.fromEntries(new FormData(f));if(table==='users'&&db.users.some(u=>u.username===v.username)){alert('El nombre de usuario ya existe');return}if(table==='projects'&&db.projects.some(p=>p.code===v.code)){alert('El código de proyecto ya existe');return}if(table==='advances'&&num(v.progress)>100){alert('El avance no puede superar 100%');return}db[table].push({id:uid(),...convert(v)});save();render()}}const pf=$('passwordForm');if(pf)pf.onsubmit=e=>{e.preventDefault();current.password=new FormData(pf).get('password');save();alert('Contraseña actualizada');render()}}
render();
</script>
</body></html>
